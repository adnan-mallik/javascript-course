<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
    
        // let a = 5; // Example number to check if even or odd
        // let b = "10"; // Another example number

        // let result = a + b;


        // for loop
        let num = 10; // Example number to check if even or odd
        for (let i = 0; i < num; i++) {
            console.log("Iteration: " + i);
        }

        // while loop
        let j = 0;
        while (j < num) {
            console.log("While Loop Iteration: " + j);
            j++;
        }

        // do-while loop
        let k = 0;
        do {
            console.log("Do-While Loop Iteration: " + k);
            k++;
        } while (k < num);
        


    </script>
</body>
</html>
