<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        //  data types is JS 
        // 1. String
        let name = "John Doe";

        // 2. Number
        let age = 30;

        // 3. Boolean
        let isActive = true;

        // 4. Null
        let emptyValue = null;

        // 5. Undefined
        let notAssigned;

        // 6. Object
        let person = {
            firstName: "Jane",
            lastName: "Doe",
            age: 25,
            isEmployed: true
        };

        // 7. Array
        let colors = ["red", "green", "blue"]; // 0, Element of array, total number of elements in array is called length of array, 


        //  operators in JS
        // Arithmetic Operators
        let sum = 5 + 3; // Addition
        let difference = 10 - 2; // Subtraction 
        let product = 4 * 2; // Multiplication
        let quotient = 8 / 2; // Division

        // Comparison Operators
        let isEqual             = (5 == 5); // Equal to
        let isNotEqual          = (5 != 3); // Not equal to
        let isGreater           = (10 > 5); // Greater than
        let isLess              = (3 < 7); // Less than
        let isGreaterOrEqual    = (5 >= 5); // Greater than or equal to
        let isLessOrEqual       = (2 <= 4); // Less than or equal to
        // Logical Operators
        let andCondition        = (true && false); // Logical AND
        let orCondition         = (true || false); // Logical OR
        let notCondition        = !true; // Logical NOT
        // Assignment Operators
        let x = 10; // Assignment
        x += 5; // Add and assign (x = x + 5)
        x -= 3; // Subtract and assign (x = x - 3)
        x *= 2; // Multiply and assign (x = x * 2)
        x /= 4; // Divide and assign (x = x / 4)

        // conditional statements
        if (age > 18) {
            console.log("Adult");
        } else {
            console.log("Minor");
        }

        

        

    </script>

</body>
</html>
