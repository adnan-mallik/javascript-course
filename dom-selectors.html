    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Class</th>
                <th>Section</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody id="students"></tbody>
    </table>

    <!-- <div id="test">

    <script>
        
        const students = [
            { rollNo: 1, name: 'Alice', class: '10', section: 'A', marks: 85 },
            { rollNo: 2, name: 'Bob', class: '10', section: 'B', marks: 90 },
            { rollNo: 3, name: 'Charlie', class: '10', section: 'A', marks: 78 },
            { rollNo: 4, name: 'David', class: '10', section: 'B', marks: 88 },
            { rollNo: 5, name: 'Ahsan', class: '10', section: 'B', marks: 95 },
        ];

        const tbody = document.getElementById('students');

        let rows = '';
        students.forEach(student => {
            rows += `
                <tr>
                    <td>${student.rollNo}</td>
                    <td>${student.name}</td>
                    <td>${student.class}</td>
                    <td>${student.section}</td>
                    <td>${student.marks}</td>
                </tr>
            `;
        });

        tbody.innerHTML = rows;
