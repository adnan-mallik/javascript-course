<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>

        // switch statement
        let day = "Tuesday"; // Example day of the week (1-7)

        switch (day) {
            case "Monday":
                console.log("Monday");
                break;
            case "Tuesday":
                console.log("Tuesday");
                break;
            case "Wednesday":
                console.log("Wednesday");
                break;
            case "Thursday":
                console.log("Thursday");
                break;
            case "Friday":
                console.log("Friday");
                break;
            case "Saturday":
                console.log("Saturday");
                break;
            case "Sunday":
                console.log("Sunday");
                break;
            default:
                console.log("Invalid day");
        }

    </script>
</body>
</html>
